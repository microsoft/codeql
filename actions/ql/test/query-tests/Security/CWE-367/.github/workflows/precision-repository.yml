name: Precision repository

on:
  pull_request_target:

permissions:
  contents: write

jobs:
  same-repository:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - run: ./trusted-repository.sh
