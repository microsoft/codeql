name: Test

on:
  pull_request_target:

permissions:
  contents: write
  pull-requests: write

jobs:
  test1:
    runs-on: ubuntu-latest
    steps:
      - name: Download named artifact
        uses: actions/download-artifact@v4.1.0 # SAFE: named same-run artifact
        with:
          name: release
      - name: Download unrestricted artifacts
        uses: actions/download-artifact@v4.1.0

      - name: Get changed files safely
        id: changed-files-safe
        uses: tj-actions/changed-files@v40
      - name: Print changed files safely
        env:
          CHANGED_FILES: ${{ steps.changed-files-safe.outputs.all_changed_files }}
        run: echo "$CHANGED_FILES"

      - name: Get changed files unsafely
        id: changed-files-exploit
        uses: tj-actions/changed-files@v40
      - name: Use changed files as shell source
        run: echo "${{ steps.changed-files-exploit.outputs.all_changed_files }}"

      - name: Disabled changed files action
        if: false
        uses: tj-actions/changed-files@v40

      - name: Gradle without configuration cache
        uses: gradle/gradle-build-action@v2.4.1
        with:
          arguments: build
      - name: Gradle with configuration cache
        uses: gradle/gradle-build-action@v2.4.1
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
        with:
          arguments: build --configuration-cache

      - name: Expose branch slug
        uses: rlespinasse/github-slug-action@v4.4.0
