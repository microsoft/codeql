on:
  issue_comment:
    types: [created]

permissions: read-all

jobs:
  without-cache:
    runs-on: ubuntu-latest
    steps:
      - run: echo ${{ github.event.comment.body }}

  with-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache@v4
        with:
          path: ~/.cache/example
          key: example-${{ github.sha }}
      - run: echo ${{ github.event.comment.body }}
